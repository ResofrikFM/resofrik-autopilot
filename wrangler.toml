name = "resofrik-autopilot"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Every 15 minutes: publish, reminders, now playing, inbox, community desk, weekly report.
# Saturday 22:00 UTC: write next week's posts and ask the Studio for carousels.
[triggers]
crons = ["*/15 * * * *", "0 22 * * 6"]

[vars]
PUBLIC_URL = "https://resofrik-autopilot.resofrikfm.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "resofrik-autopilot"
database_id = "fe565770-7278-410c-a69f-8b1e55505be5"

# Media storage for pictures and videos
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "resofrik-media"

[observability]
enabled = true
